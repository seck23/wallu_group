# Site statique Wallu Group (dossier out/), derrière le Caddy du serveur.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /_next/static/ {
    expires 1y;
    try_files $uri =404;
  }

  # Pas de $uri/ : /projects est à la fois une page et un dossier.
  location / {
    try_files $uri $uri.html =404;
  }
  location = / { try_files /index.html =404; }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
